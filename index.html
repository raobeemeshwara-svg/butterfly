<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusHub — Your whole campus in one colourful place</title>
  <meta name="description" content="CampusHub is a student and faculty portal for tasks, events, attendance, notes and study resources, with a built-in AI Companion.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='6' r='6' fill='%236d4aff'/%3E%3Ccircle cx='32' cy='13' r='6' fill='%23ff4d8d'/%3E%3Ccircle cx='32' cy='27' r='6' fill='%23ff8a1f'/%3E%3Ccircle cx='20' cy='34' r='6' fill='%2312c48b'/%3E%3Ccircle cx='8' cy='27' r='6' fill='%2314b0ff'/%3E%3Ccircle cx='8' cy='13' r='6' fill='%23ffc61a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="overlay"></div>
  <noscript><p style="padding:24px;font-family:system-ui">CampusHub needs JavaScript. Please enable it and reload.</p></noscript>
  <script src="data.js" onerror="window.__missing=(window.__missing||[]).concat('data.js')"></script>
  <script src="app.js" onerror="window.__missing=(window.__missing||[]).concat('app.js')"></script>
  <script>
    // If the app did not start, say why instead of leaving a blank screen.
    window.addEventListener("load", function () {
      setTimeout(function () {
        if (window.__chBooted) return;
        var a = document.getElementById("app");
        if (a && a.innerHTML.trim()) return;
        var why = window.__missing ? "Missing file(s): " + window.__missing.join(", ") + ". Keep index.html, styles.css, data.js and app.js in the same folder." : "A script error stopped the app. Open the browser console (F12) to see it.";
        a.innerHTML = '<div style="max-width:560px;margin:12vh auto;padding:24px;font-family:system-ui;line-height:1.5"><h1 style="font-size:1.6rem">CampusHub couldn\'t start</h1><p style="margin-top:10px">' + why + '</p></div>';
      }, 600);
    });
  </script>
</body>
</html>
